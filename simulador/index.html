<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Network Monitor | Simulação CTF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #090a0f, #1a202c, #111827);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .terminal-output {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #000000;
            color: #00ff00;
        }
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="text-gray-100 flex items-center justify-center p-6 font-sans">

    <main class="glass-panel w-full max-w-4xl rounded-2xl p-8 relative transition-all duration-300">
        
        <header class="mb-8 border-b border-gray-700 pb-5 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="p-3 bg-blue-500/10 rounded-lg border border-blue-500/20">
                    <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-wider text-blue-400">AEGIS <span class="text-gray-100">DIAGNOSTICS</span></h1>
                    <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest">Simulador Web de Infraestrutura</p>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-yellow-500/10 px-3 py-1 rounded-full border border-yellow-500/20">
                <span class="h-2 w-2 rounded-full bg-yellow-500 animate-pulse"></span>
                <span class="text-xs text-yellow-400 uppercase font-bold tracking-wide">Modo Simulador</span>
            </div>
        </header>

        <section class="mb-6">
            <form id="pingForm" class="flex flex-col sm:flex-row gap-4">
                <div class="flex-grow">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                        </div>
                        <input type="text" id="ipInput" placeholder="Insira o Endereço IP (Ex: 127.0.0.1)" 
                               class="w-full bg-gray-900/80 border border-gray-700 rounded-lg pl-10 pr-4 py-3 text-sm text-gray-100 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-inner" required>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg shadow-[0_0_15px_rgba(37,99,235,0.4)] hover:shadow-[0_0_25px_rgba(59,130,246,0.6)] transition-all duration-300 flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Analisar Rota
                </button>
            </form>
        </section>

        <section>
            <div class="flex justify-between items-center mb-2 px-1">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Saída do Terminal</h3>
                <span class="text-[10px] text-gray-600">bash - aegis_admin@srv-01</span>
            </div>
            
            <div class="terminal-output rounded-lg p-5 min-h-[250px] max-h-[400px] overflow-y-auto border border-gray-800 relative">
                <pre id="terminalContent" class="whitespace-pre-wrap text-sm leading-relaxed mt-2 text-gray-400">Pronto para simulação...<span class="cursor-blink text-gray-400">_</span></pre>
            </div>
        </section>
    </main>
    
    <script>
        document.getElementById('pingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const ip = document.getElementById('ipInput').value;
            const terminal = document.getElementById('terminalContent');
            const btn = document.getElementById('submitBtn');
            
            btn.disabled = true;
            btn.innerHTML = 'Processando...';
            
            terminal.innerHTML = `<span class="text-blue-400">aegis_admin@srv-01:~$</span> ping_tool --target ${ip}<br><br>`;
            terminal.innerHTML += `<span class="text-yellow-400">[*] Simulando resolução de DNS...</span><br>`;
            
            setTimeout(() => {
                let outputText = "";

                // MÁQUINA DE ESTADOS DO SIMULADOR (IF/ELSE)
                if (ip.includes("cat flag/flag.txt") || ip.includes("cat flag.txt")) {
                    // Simula o acerto da flag
                    outputText = `PING ${ip.split(';')[0]} (127.0.0.1) 56(84) bytes of data.\n64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.034 ms\n\nFLAG{c0mm4nd_1nj3ct10n_s1mul4t3d_w3b}`;
                } 
                else if (ip.includes("; ls") || ip.includes("&& ls")) {
                    // Simula o comando ls
                    outputText = `PING ${ip.split(';')[0]} (127.0.0.1) 56(84) bytes of data.\n64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.015 ms\n\n.:\ntotal 36\ndrwxrwxrwx 1 root root 4096 ago 26 15:00 .\ndrwxrwxrwx 1 root root    0 ago 26 15:00 assets\ndrwxrwxrwx 1 root root    0 ago 26 15:00 flag\n-rwxrwxrwx 1 root root 9941 ago 26 15:15 index.html\ndrwxrwxrwx 1 root root    0 ago 26 15:00 scripts`;
                } 
                else if (ip === "127.0.0.1" || ip === "localhost") {
                    // Simula um ping normal
                    outputText = `PING ${ip} (127.0.0.1) 56(84) bytes of data.\n64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.015 ms\n64 bytes from 127.0.0.1: icmp_seq=2 ttl=64 time=0.020 ms\n\n--- ${ip} ping statistics ---\n2 packets transmitted, 2 received, 0% packet loss, time 1002ms`;
                } 
                else {
                    // Simula um erro genérico para qualquer outra coisa
                    outputText = `ping: ${ip}: Falha ao alcançar o host. No simulator mode, tente '127.0.0.1' ou use '; ls' para explorar.`;
                }

                terminal.innerHTML = `<span class="text-blue-400">aegis_admin@srv-01:~$</span> ping_tool --target ${ip}<br><br><span class="text-green-400">${outputText}</span><br><br><span class="text-blue-400">aegis_admin@srv-01:~$</span> <span class="cursor-blink text-green-500">_</span>`;
                
                btn.disabled = false;
                btn.innerHTML = 'Analisar Rota';
            }, 1500);
        });
    </script>
</body>
</html>
